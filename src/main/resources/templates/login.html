<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

<h2>Login</h2>

<form action="/perform_login" method="post">
	
	<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

    <input type="text" name="username">
    <input type="password" name="password">
    <button type="submit">Login</button>
</form>

</body>
</html>
